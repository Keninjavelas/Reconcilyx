{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "reconcilyx.fullname" . }}-netpol
  labels:
    {{- include "reconcilyx.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "reconcilyx.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - ports:
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 8081
        - protocol: TCP
          port: {{ .Values.service.apiPort | default 8082 }}
      {{- with .Values.networkPolicy.ingressFrom }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  egress:
    # DNS resolution inside cluster
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Kubernetes API server, HTTPS cloud pricing/carbon/OIDC/GitOps APIs, and Prometheus/Hub
    - ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 6443
        - protocol: TCP
          port: 8082
        - protocol: TCP
          port: 9090
      {{- with .Values.networkPolicy.egressTo }}
      to:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
