replicaCount: 1

image:
  repository: ghcr.io/keninjavelas/reconcilyx
  pullPolicy: IfNotPresent
  # Defaults to .Chart.AppVersion when empty. Set this to an image tag you have published.
  tag: ""
  # Optional immutable sha256 digest pin (recommended for production: "sha256:...")
  digest: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  # Annotate for keyless cloud workload identity instead of static cloud API keys:
  #   AWS IRSA: eks.amazonaws.com/role-arn: "arn:aws:iam::<account>:role/reconcilyx-pricing"
  #   GCP WI:   iam.gke.io/gcp-service-account: "reconcilyx@<project>.iam.gserviceaccount.com"
  annotations: {}
  name: "reconcilyx-controller-manager"

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
    - ALL
  readOnlyRootFilesystem: true

service:
  type: ClusterIP
  metricsPort: 8080
  apiPort: 8082

api:
  # Leave empty only for local development. The UI sends this value as X-API-Key.
  key: ""
  # Comma-separated browser origins allowed to call the API, for example:
  # https://keninjavelas.github.io
  corsOrigins: ""

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

config:
  logLevel: "info"
  enableInPlaceResizing: false
  enableGitOpsPR: true
  enableCarbonAwareness: true
  prometheusUrl: "http://prometheus-k8s.monitoring.svc:9090"
  gridLocation: "us-east-1"
  defaultCostWeight: 0.6
  defaultCarbonWeight: 0.4

# Split-RBAC Actuation Posture (default: read-only / GitOps PR mode)
actuation:
  # Set to true only when authorizing ephemeral in-place pods/resize mutations.
  inPlaceResizeEnabled: false
  # Allow live in-place memory shrinking when proposed memory retains >=1.35x working-set headroom.
  allowInPlaceMemoryShrink: false
  # Namespaces excluded from in-place or workload actuation.
  excludedNamespaces: "kube-system,kube-public,kube-node-lease,reconcilyx-system,flux-system,argocd"

# BYOK LLM Provider Configuration
llm:
  provider: "ollama"  # Options: ollama, openai, anthropic, groq, cohere
  ollama:
    baseURL: "http://localhost:11434"
    model: "llama3.2:3b"
  openai:
    apiKey: ""
    model: "gpt-4o-mini"
  anthropic:
    apiKey: ""
    model: "claude-3-5-haiku-20241022"
  groq:
    apiKey: ""
    model: "llama-3.3-70b-versatile"
  cohere:
    apiKey: ""
    model: "command-r-plus"

# Carbon Footprint Intensity Configuration
carbon:
  provider: "static" # Options: static, electricitymaps, watttime
  cacheTTLHours: 1
  static:
    fallbackIntensity: 385 # gCO2/kWh
  electricitymaps:
    apiKey: ""
    baseURL: "https://api.electricitymap.org/v3/carbon-intensity/latest"
  watttime:
    apiKey: ""
    username: ""
    password: ""
    baseURL: "https://api.watttime.org/api/v3"

# Multi-Cloud Pricing Provider Configuration
pricing:
  cacheTTLHours: 1
  providers:
    aws:
      enabled: true
      # Credentials — if set, the AWS Price List Query API is used (otherwise static fallback).
      accessKeyId: ""
      secretAccessKey: ""
      sessionToken: ""
    gcp:
      enabled: true
      # Cloud Billing Catalog API key. Empty = static fallback.
      apiKey: ""
    azure:
      enabled: true
      # Azure Retail Prices API is public; no credentials or subscription are required.

# Federated Learning Collective Brain Configuration
federation:
  enabled: false
  role: "standalone" # standalone | hub | spoke
  hubUrl: ""
  clusterName: "default-cluster"
  modelChannel: "stable"
  flushThreshold: 100
  flushInterval: "1h"
  compactThreshold: 500
  compactInterval: "15m"

# Zero-Trust Multi-Identity Inbound Authentication
auth:
  oidc:
    issuerUrl: ""
    clientId: ""
    jwksUrl: ""
    adminGroups: "reconcilyx-admins,platform-admins"
    ciGroups: "reconcilyx-ci,ci-auditors"
    viewerGroups: ""
    githubRepos: ""
  tlsClientCA:
    secretName: ""
    key: "ca.crt"
  scopedKeys:
    secretName: ""
    key: "RECONCILYX_SCOPED_API_KEYS"

# Outbound Secret Isolation via ExternalSecret / Projected Tmpfs Mounts
externalSecrets:
  enabled: false
  mountPath: "/var/run/secrets/reconcilyx"
  awsSecretName: ""
  gcpSecretName: ""
  githubSecretName: ""
  electricityMapsSecretName: ""
  wattTimeSecretName: ""

# High Availability, Network Isolation, and SLO Alerting
pdb:
  enabled: false
  minAvailable: 1
  maxUnavailable: ""

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 85

networkPolicy:
  enabled: false
  ingressFrom: []
  egressTo: []

monitoring:
  prometheusRule:
    enabled: false
    labels: {}
    runbookBaseUrl: "https://github.com/keninjavelas/Reconcilyx/blob/main/docs/RUNBOOK.md"

nodeSelector: {}
tolerations: []
affinity: {}
