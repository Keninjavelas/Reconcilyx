---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - optimization.reconcilyx.io
  resources:
  - optimizationpolicies
  - optimizationproposals
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - optimization.reconcilyx.io
  resources:
  - optimizationpolicies/finalizers
  - optimizationproposals/finalizers
  verbs:
  - update
- apiGroups:
  - optimization.reconcilyx.io
  resources:
  - optimizationpolicies/status
  - optimizationproposals/status
  verbs:
  - get
  - patch
  - update
