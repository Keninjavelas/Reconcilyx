apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    reconcilyx.io/last-proposal: h06-protected-proposal
  labels:
    app: cpu-burner
  name: cpu-burner
  namespace: reconcilyx-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cpu-burner
  template:
    metadata:
      labels:
        app: cpu-burner
    spec:
      containers:
      - image: reconcilyx/cpu-burner:latest
        imagePullPolicy: IfNotPresent
        name: cpu-burner
        ports:
        - containerPort: 8080
          name: http
        resources:
          limits:
            cpu: 1000m
            memory: 256Mi
          requests:
            cpu: 250m
            memory: 96Mi
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: cpu-burner
  name: cpu-burner
  namespace: reconcilyx-system
spec:
  ports:
  - name: http
    port: 8080
    targetPort: http
  selector:
    app: cpu-burner
