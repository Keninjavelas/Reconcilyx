apiVersion: apps/v1
kind: Deployment
metadata:
  name: idle-service
  namespace: reconcilyx-system
  labels:
    app: idle-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: idle-service
  template:
    metadata:
      labels:
        app: idle-service
    spec:
      containers:
      - name: idle-service
        image: reconcilyx/idle-service:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
          name: http
        resources:
          requests:
            cpu: 250m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: idle-service
  namespace: reconcilyx-system
  labels:
    app: idle-service
spec:
  ports:
  - port: 8080
    targetPort: http
    name: http
  selector:
    app: idle-service
