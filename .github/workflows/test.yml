name: Test
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Typecheck, test, and build embedded UI
        working-directory: ui
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build
      - uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
      - name: Run Go unit and envtest suites with race detector
        run: |
          make envtest
          KUBEBUILDER_ASSETS="$(./bin/setup-envtest use 1.31.0 -p path)" go test -race $(go list ./... | grep -v '/e2e$')
      - name: Run Helm template assertions
        run: bash charts/reconcilyx/tests/helm_template_test.sh
