name: Build
on:
  push:
    branches: [ "main", "gitops-protected-target" ]
  pull_request:
    branches: [ "main", "gitops-protected-target" ]
jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Build embedded UI
        working-directory: ui
        run: |
          npm ci
          npm run typecheck
          npm run build
      - uses: actions/setup-go@v5
        with:
          go-version: '^1.26.11'
          check-latest: true
      - name: Build manager and kubectl-reconcilyx CLI
        run: |
          go build -o bin/manager ./cmd/main.go
          go build -o bin/kubectl-reconcilyx ./cmd/kubectl-reconcilyx
      - name: Lint and test Helm chart templates
        run: bash charts/reconcilyx/tests/helm_template_test.sh
