version: 2

project_name: reconcilyx

before:
  hooks:
    - sh -c "cd ui && npm ci && npm run build"

builds:
  - id: kubectl-reconcilyx
    main: ./cmd/kubectl-reconcilyx
    binary: kubectl-reconcilyx
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/reconcilyx/operator/cmd/kubectl-reconcilyx/cmd.Version={{ .Version }}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

  - id: reconcilyx-manager
    main: ./cmd/main.go
    binary: reconcilyx-manager
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
    goos:
      - linux
    goarch:
      - amd64
      - arm64

archives:
  - id: cli-archives
    ids:
      - kubectl-reconcilyx
    name_template: >-
      {{ .Binary }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt
  algorithm: sha256

sboms:
  - artifacts: archive

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
